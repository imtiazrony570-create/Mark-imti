# Fly.io configuration for Mark-Imti Backend
# Run: fly launch --name mark-imti-backend --region iad --no-deploy
# Then: fly secrets set DATABASE_URL=... SECRET_KEY=... CREDENTIAL_VAULT_KEY=...
# Deploy: fly deploy

app = "mark-imti-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  # These are set via `fly secrets set`:
  # DATABASE_URL
  # SECRET_KEY
  # CREDENTIAL_VAULT_KEY
  # CORS_ORIGIN_REGEX = "https://.*\\.pages\\.dev"

[experimental]
  auto_rollback = true