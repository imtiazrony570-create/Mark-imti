name = "mark-imti-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Edge proxy in front of the Python backend.
# The database is Neon Postgres (DATABASE_URL on the backend), so there is no
# D1 binding here — the earlier draft referenced one and would fail validation.

[observability]
enabled = true

[vars]
# Non-secret defaults only. BACKEND_URL is a *secret* (set with
# `wrangler secret put BACKEND_URL`) so the real host is never in the repo or
# in the uploaded bundle. Do not also declare it under [vars] - Cloudflare
# rejects a name that exists in both places.
CORS_ORIGINS = "https://mark-imti.pages.dev,http://localhost:3000"

[env.production]
name = "mark-imti-api"
workers_dev = true
