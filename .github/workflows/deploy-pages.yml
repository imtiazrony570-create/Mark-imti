name: Deploy Mark-Imti WebApp

on:
  push:
    branches: ["master"]
    paths:
      - "mark-jenny/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mark-jenny/frontend/package-lock.json

      - name: Install dependencies
        working-directory: mark-jenny/frontend
        run: npm ci

      - name: Build static WebApp
        working-directory: mark-jenny/frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /Mark-imti
          NEXT_PUBLIC_API_URL: https://mark-imti-api.imtiazrony570.workers.dev/api/v1
          NEXT_PUBLIC_STATIC_MODE: true
        run: npm run build -- --webpack

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mark-jenny/frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
