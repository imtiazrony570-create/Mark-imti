name: Mark-Imti Build Diagnostics
on:
  push:
    branches: ["master"]
    paths-ignore:
      - "mark-jenny/frontend/build-error.txt"

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mark-jenny/frontend/package-lock.json
      - working-directory: mark-jenny/frontend
        run: npm ci
      - name: Capture build failure
        working-directory: mark-jenny/frontend
        shell: bash
        run: |
          set +e
          npm run build -- --webpack > build-error.txt 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then rm -f build-error.txt; exit 0; fi
          tail -n 250 build-error.txt > build-error.tmp && mv build-error.tmp build-error.txt
          exit $rc
      - name: Commit compiler diagnostics
        if: failure()
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mark-jenny/frontend/build-error.txt
          git commit -m "Add static build diagnostics" || exit 0
          git push
