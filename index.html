<body>
<div id="app" class="app"></div>
<script>
(()=>{"use strict";
const KEY="mark-imti-v3";
const now=()=>new Date().toISOString();
const uid=p=>p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36);
function defaultBrowserSession(id="bs1",title="New browsing session"){
 const tabId=uid("bt");
 return {id,title,pinned:false,createdAt:now(),updatedAt:now(),tabs:[{id:tabId,title:"New Tab",url:"",history:[],future:[]}],activeTabId:tabId};
}
const seed={
 chats:[
  {id:"c1",title:"Welcome to Mark-Imti",projectId:"p1",pinned:true,createdAt:now(),updatedAt:now(),messages:[{id:"m1",role:"assistant",text:"Welcome to Mark-Imti. This local workspace is ready for chats, projects, browsing, skills, schedules, and settings."}]},
  {id:"c2",title:"Product planning",projectId:null,pinned:false,createdAt:now(),updatedAt:now(),messages:[{id:"m2",role:"user",text:"Plan a small product launch."},{id:"m3",role:"assistant",text:"I can help break the launch into milestones, tasks, owners, and dates."}]}
 ],
 projects:[{id:"p1",title:"Mark-Imti Website",description:"Build and refine the Mark-Imti workspace.",pinned:true,createdAt:now(),updatedAt:now()}],
 library:[{id:"l1",title:"Mark-Imti UI Reference",description:"Dark workspace visual reference and interaction notes.",type:"Reference",pinned:true,createdAt:now()}],
 schedules:[{id:"s1",title:"Review project tasks",dateTime:new Date(Date.now()+86400000).toISOString().slice(0,16),repeat:"Once",enabled:true,createdAt:now(),updatedAt:now()}],
 skills:[{id:"sk1",name:"Writing",description:"Draft and refine structured text.",enabled:true},{id:"sk2",name:"Research",description:"Organize research tasks and findings.",enabled:true},{id:"sk3",name:"Web Browse",description:"Prepare browser research workflows.",enabled:false}],
 browserSessions:[defaultBrowserSession()],
 profile:{email:"local@mark-imti.app",fullName:"Local User",role:"user",instructions:"",nickname:"",occupation:"",about:""},
 appearance:{theme:"dark",density:"comfortable"}
};
let state=load();
function load(){
 try{
  const raw=localStorage.getItem(KEY);
  if(raw)return normalize(JSON.parse(raw));
 }catch(e){}
 const legacy=(()=>{try{return JSON.parse(localStorage.getItem(KEY+"_tabs")||"null")}catch(e){return null}})();
 const base=JSON.parse(JSON.stringify(seed));
 if(Array.isArray(legacy)&&legacy.length)base.browserSessions=[{id:"bs1",title:"New browsing session",pinned:false,createdAt:now(),updatedAt:now(),tabs:legacy,activeTabId:legacy[0]?.id||null}];
 return normalize({data:base,ui:{mode:"imti",section:"quick",chatId:"c1",projectId:"p1",browserSessionId:"bs1",openChatIds:["c1"],settingsOpen:false,settingsSection:"Profile",settingsQuery:""}});
}
function normalize(x){
 const d=x.data||seed,u=x.ui||{};
 const browserSessions=Array.isArray(d.browserSessions)&&d.browserSessions.length?d.browserSessions:(seed.browserSessions||[defaultBrowserSession()]);
 const chats=Array.isArray(d.chats)?d.chats:[];
 chats.forEach(c=>{if(!("projectId" in c))c.projectId=null;if(!Array.isArray(c.messages))c.messages=[]});
 browserSessions.forEach(bs=>{
  if(!Array.isArray(bs.tabs)||!bs.tabs.length){const t=defaultBrowserSession(bs.id+"_new",bs.title||"New browsing session");bs.tabs=t.tabs;bs.activeTabId=t.activeTabId}
  if(!bs.activeTabId||!bs.tabs.some(t=>t.id===bs.activeTabId))bs.activeTabId=bs.tabs[0]?.id
 });
 const activeSession=browserSessions.find(x=>x.id===u.browserSessionId)||browserSessions[0];
 const openChatIds=Array.isArray(u.openChatIds)?u.openChatIds.filter(id=>chats.some(c=>c.id===id)):((u.chatId&&chats.some(c=>c.id===u.chatId))?[u.chatId]:[chats[0]?.id].filter(Boolean));
 return {data:{chats,projects:Array.isArray(d.projects)?d.projects:[],library:Array.isArray(d.library)?d.library:[],schedules:Array.isArray(d.schedules)?d.schedules:[],skills:Array.isArray(d.skills)?d.skills:[],browserSessions,profile:{...seed.profile,...(d.profile||{})},appearance:{...seed.appearance,...(d.appearance||{})}},ui:{mode:u.mode||"imti",section:u.section||"quick",chatId:u.chatId&&chats.some(c=>c.id===u.chatId)?u.chatId:(openChatIds[0]||null),projectId:u.projectId||null,browserSessionId:activeSession?.id||"bs1",openChatIds,settingsOpen:false,settingsSection:u.settingsSection||"Profile",settingsQuery:""}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({data:state.data,ui:{...state.ui,settingsOpen:false}}))}catch(e){}}
function esc(v){const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML}
function fmt(s){try{return new Date(s).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return s}}
const icons={quick:"✣",schedule:"◷",skills:"✧",library:"▤",projects:"▱",chat:"◉",pin:"⚑",settings:"⚙",browser:"◎",search:"⌕",plus:"＋",close:"×",send:"↑",back:"‹",forward:"›",reload:"↻",external:"↗",trash:"⌫",edit:"✎"};
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function route(section,extra={}){state.ui.section=section;Object.assign(state.ui,extra);save();render()}
function setMode(mode){
 state.ui.mode=mode;
 if(mode==="imti"&&![ "quick","chat","schedule","skills","pinned-chats","search" ].includes(state.ui.section))state.ui.section="quick";
 if(mode==="mark"&&![ "quick","chat","library","skills","projects","pinned-projects" ].includes(state.ui.section))state.ui.section="quick";
 if(mode==="browser"&&![ "quick","schedule","library","skills","pinned-browser-sessions","browser" ].includes(state.ui.section))state.ui.section="browser";
 save();render();
}
function currentChat(){return state.data.chats.find(c=>c.id===state.ui.chatId)||state.data.chats[0]||null}
function currentProject(){return state.data.projects.find(p=>p.id===state.ui.projectId)||state.data.projects[0]||null}
function modeLabel(){return state.ui.mode==="imti"?"IMTI":state.ui.mode==="mark"?"MARK":"BROWSER"}
function sidebar(){
 const mode=state.ui.mode;
 const imti=mode==="imti",mark=mode==="mark",browser=mode==="browser";
 const nav=browser?[
  ["quick",icons.quick,"Quick Action"],["schedule",icons.schedule,"Schedule"],["library",icons.library,"Library"],["skills",icons.skills,"Skills"],["pinned-browser-sessions",icons.pin,"Pinned Browsing Sessions"]
 ]:mark?[
  ["quick",icons.quick,"Quick Action"],["library",icons.library,"Library"],["skills",icons.skills,"Skills"],["pinned-projects",icons.pin,"Pinned Projects"]
 ]:[
  ["quick",icons.quick,"Quick Action"],["schedule",icons.schedule,"Schedule"],["skills",icons.skills,"Skills"],["pinned-chats",icons.pin,"Pinned Chats"]
 ];
 let list="";
 if(imti){

 state.data.projects.unshift(p);openProject(p.id);
}
function editProject(id){const p=state.data.projects.find(x=>x.id===id);if(!p)return;const title=prompt("Project title",p.title);if(title===null)return;const desc=prompt("Project description",p.description);if(desc===null)return;p.title=title.trim()||p.title;p.description=desc.trim()||p.description;p.updatedAt=now();save();render()}
function deleteProject(id){
 if(!confirm("Delete this project and its project chats?"))return;
 state.data.projects=state.data.projects.filter(x=>x.id!==id);
 state.data.chats=state.data.chats.filter(c=>c.projectId!==id);
 if(state.ui.projectId===id){
  state.ui.projectId=state.data.projects[0]?.id||null;
  const next=state.ui.projectId?projectChats(state.ui.projectId)[0]?.id:null;
  state.ui.chatId=next||null;
  state.ui.section=state.ui.projectId?"chat":"projects";
 }
 save();render();
}
function newLibrary(){const title=prompt("Library item title","New Resource");if(!title?.trim())return;const desc=prompt("Description","Saved Mark-Imti resource");if(desc===null)return;state.data.library.unshift({id:uid("l"),title:title.trim(),description:desc.trim(),type:"Note",pinned:false,createdAt:now()});save();render()}
function newSchedule(){const title=prompt("Task title","New scheduled task");if(!title?.trim())return;const dt=prompt("Date/time (YYYY-MM-DDTHH:MM)",new Date(Date.now()+86400000).toISOString().slice(0,16));if(!dt)return;state.data.schedules.unshift({id:uid("s"),title:title.trim(),dateTime:dt,repeat:"Once",enabled:true});save();render()}
function deleteChat(id){
 if(!confirm("Delete this chat?"))return;
 state.data.chats=state.data.chats.filter(x=>x.id!==id);
 state.ui.openChatIds=(state.ui.openChatIds||[]).filter(x=>x!==id);
 if(state.ui.chatId===id){state.ui.chatId=state.ui.openChatIds.at(-1)||state.data.chats[0]?.id||null;state.ui.section=state.ui.chatId?"chat":"quick"}
 save();render();
}
function bind(){
 document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
 document.querySelectorAll("[data-section]").forEach(b=>b.onclick=()=>{state.ui.section=b.dataset.section;save();render();closeSidebar()});
 document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>openChatTab(b.dataset.chat,"imti"));
 document.querySelectorAll("[data-project]").forEach(b=>b.onclick=()=>openProject(b.dataset.project));
 document.querySelectorAll("[data-browser-session]").forEach(b=>b.onclick=()=>{state.ui.mode="browser";state.ui.section="browser";state.ui.browserSessionId=b.dataset.browserSession;save();render();closeSidebar()});
 document.querySelectorAll("[data-chat-tab]").forEach(b=>b.onclick=()=>openChatTab(b.dataset.chatTab,state.ui.mode==="mark"?"mark":"imti"));
 document.querySelectorAll("[data-close-chat-tab]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.closeChatTab;state.ui.openChatIds=(state.ui.openChatIds||[]).filter(x=>x!==id);if(state.ui.chatId===id){const next=state.ui.openChatIds.at(-1);if(next)state.ui.chatId=next;else state.ui.section="quick"}save();render()});
 document.querySelectorAll("[data-browser-tab]").forEach(b=>b.onclick=()=>{const ss=currentBrowserSession();if(ss){ss.activeTabId=b.dataset.browserTab;ss.updatedAt=now();state.ui.section="browser";save();render()}});
 document.querySelectorAll("[data-close-browser-tab]").forEach(b=>b.onclick=e=>{e.stopPropagation();closeBrowserTab(b.dataset.closeBrowserTab)});
 document.querySelectorAll("[data-pin-browser-session]").forEach(b=>b.onclick=e=>{e.stopPropagation();const ss=state.data.browserSessions.find(x=>x.id===b.dataset.pinBrowserSession);if(ss)ss.pinned=!ss.pinned;save();render()});
 document.querySelectorAll("[data-suggest]").forEach(b=>b.onclick=()=>{if(state.ui.mode==="browser")browseQuery(b.dataset.suggest);else sendChat(b.dataset.suggest)});
 document.querySelectorAll("[data-open-chat]").forEach(b=>b.onclick=()=>openChatTab(b.dataset.openChat,"imti"));
 document.querySelectorAll("[data-pin-chat],[data-pin-chat2]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.pinChat||b.dataset.pinChat2;const c=state.data.chats.find(x=>x.id===id);if(c)c.pinned=!c.pinned;save();render()});
 document.querySelectorAll("[data-delete-chat]").forEach(b=>b.onclick=()=>deleteChat(b.dataset.deleteChat));
 document.querySelectorAll("[data-open-library]").forEach(b=>b.onclick=()=>{state.ui.mode=state.ui.mode==="browser"?"browser":"mark";state.ui.section="library";save();render()});
 const gs=document.getElementById("globalSearch");if(gs)gs.addEventListener("input",()=>{state.ui.searchQuery=gs.value;render();setTimeout(()=>{const x=document.getElementById("globalSearch");if(x){x.focus();x.selectionStart=x.value.length}},0)});
 document.querySelectorAll("[data-open-project]").forEach(b=>b.onclick=()=>openProject(b.dataset.openProject));
 document.querySelectorAll("[data-edit-project]").forEach(b=>b.onclick=()=>editProject(b.dataset.editProject));
 document.querySelectorAll("[data-delete-project]").forEach(b=>b.onclick=()=>deleteProject(b.dataset.deleteProject));
 document.querySelectorAll("[data-toggle-project]").forEach(b=>b.onclick=e=>{e.stopPropagation();const p=state.data.projects.find(x=>x.id===b.dataset.toggleProject);if(p)p.pinned=!p.pinned;save();render()});
 document.querySelectorAll("[data-toggle-library]").forEach(b=>b.onclick=()=>{const x=state.data.library.find(x=>x.id===b.dataset.toggleLibrary);if(x)x.pinned=!x.pinned;save();render()});
 document.querySelectorAll("[data-delete-library]").forEach(b=>b.onclick=()=>{state.data.library=state.data.library.filter(x=>x.id!==b.dataset.deleteLibrary);save();render()});
 document.querySelectorAll("[data-toggle-schedule]").forEach(b=>b.onclick=()=>{const x=state.data.schedules.find(x=>x.id===b.dataset.toggleSchedule);if(x)x.enabled=!x.enabled;save();render()});
 document.querySelectorAll("[data-delete-schedule]").forEach(b=>b.onclick=()=>{state.data.schedules=state.data.schedules.filter(x=>x.id!==b.dataset.deleteSchedule);save();render()});
 document.querySelectorAll("[data-skill]").forEach(b=>b.onclick=()=>{const x=state.data.skills.find(x=>x.id===b.dataset.skill);if(x)x.enabled=!x.enabled;save();render()});
 document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
 const input=document.getElementById("composer");if(input)input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const v=input.value;if(state.ui.mode==="browser")browseQuery(v);else sendChat(v)}})
 const address=document.getElementById("address");if(address)address.addEventListener("keydown",e=>{if(e.key==="Enter")browserNavigate(address.value)})
 const ss=document.getElementById("settingsSearch");if(ss)ss.addEventListener("input",()=>{state.ui.settingsQuery=ss.value;render();setTimeout(()=>{const n=document.getElementById("settingsSearch");if(n){n.focus();n.selectionStart=n.value.length}},0)});
 document.querySelectorAll("[data-setting]").forEach(b=>b.onclick=()=>{state.ui.settingsSection=b.dataset.setting;save();render()});
 document.querySelectorAll("[data-profile]").forEach(e=>e.addEventListener("input",()=>{state.data.profile[e.dataset.profile]=e.value}));
 document.querySelectorAll("[data-setting-toggle]").forEach(b=>b.onclick=()=>{const k=b.dataset.settingToggle;if(k==="theme")state.data.appearance.theme=state.data.appearance.theme==="dark"?"light":"dark";if(k==="density")state.data.appearance.density=state.data.appearance.density==="comfortable"?"compact":"comfortable";save();render()});
}
function keyHandler(e){if(e.key==="Escape"&&state.ui.settingsOpen){state.ui.settingsOpen=false;save();render();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();state.ui.settingsOpen=true;save();render()}}
function closeSidebar(){document.getElementById("sidebar")?.classList.remove("open")}
function browseQuery(v){v=v.trim();if(!v)return;browserNavigate(v)}
function act(a){
 if(a==="new-chat")newChat();
 else if(a==="new-project")newProject();
 else if(a==="new-library")newLibrary();
 else if(a==="new-schedule")newSchedule();
 else if(a==="new-browser-session")newBrowserSession();
 else if(a==="new-browser-tab")newBrowserTab();
 else if(a==="library")route("library",{mode:state.ui.mode==="browser"?"browser":"mark"});
 else if(a==="skills")route("skills");
 else if(a==="browser")setMode("browser");
 else if(a==="open-current-project")openProject(state.ui.projectId);
 else if(a==="settings"){state.ui.settingsOpen=true;save();render()}
 else if(a==="close-settings"){state.ui.settingsOpen=false;save();render()}
 else if(a==="drawer"){document.getElementById("sidebar")?.classList.toggle("open")}
 else if(a==="send-chat"){const i=document.getElementById("composer");if(i)sendChat(i.value)}
 else if(a==="browse-query"){const i=document.getElementById("composer");if(i)browseQuery(i.value)}
 else if(a==="attach")toast("Attachment actions are local-only in this build.");
 else if(a==="think")toast("Think is a local UI mode; no external model is connected.");
 else if(a==="search"){state.ui.searchQuery="";state.ui.mode="imti";state.ui.section="search";save();render();setTimeout(()=>document.getElementById("globalSearch")?.focus(),50)}
 else if(a==="activity")toast("Recent activity is represented by updated timestamps in the workspace.");
 else if(a==="save-profile"){document.querySelectorAll("[data-profile]").forEach(e=>state.data.profile[e.dataset.profile]=e.value);save();toast("Profile saved");render()}
 else if(a==="back"){const ss=currentBrowserSession(),t=currentBrowserTab();if(t&&t.history?.length){t.future=[t.url,...(t.future||[])];t.url=t.history.pop()||"";t.title=t.url?new URL(t.url).hostname:"New Tab";ss.updatedAt=now();save();render()}}
 else if(a==="forward"){const ss=currentBrowserSession(),t=currentBrowserTab();if(t&&t.future?.length){if(t.url)t.history=[...(t.history||[]),t.url];t.url=t.future.shift()||"";t.title=t.url?new URL(t.url).hostname:"New Tab";ss.updatedAt=now();save();render()}}
 else if(a==="reload"){if(currentBrowserTab()?.url)toast("Reload requested; external sites stay isolated when embedding is blocked.")}
 else if(a==="go-address"){const i=document.getElementById("address");if(i)browserNavigate(i.value)}
 else if(a==="open-external"){const t=currentBrowserTab();if(t?.url)window.open(t.url,"_blank","noopener,noreferrer")}
}
function syncHash(){
 let h;
 if(state.ui.mode==="browser")h=state.ui.section==="browser"?"#/browser/session/"+(state.ui.browserSessionId||""):"#/browser/"+state.ui.section;
 else if(state.ui.mode==="mark")h=state.ui.section==="chat"?"#/mark/projects/"+(state.ui.projectId||"")+"/chat/"+(state.ui.chatId||""):(state.ui.section==="project"?"#/mark/projects/"+(state.ui.projectId||""):"#/mark/"+state.ui.section);
 else h=state.ui.section==="chat"?"#/imti/chat/"+(state.ui.chatId||""):"#/imti/"+state.ui.section;
 if(location.hash!==h)history.replaceState(null,"",h);
}
function loadHash(){
 const p=location.hash.replace(/^#\//,"").split("/");
 if(!p[0])return;
 if(p[0]==="browser"){state.ui.mode="browser";if(p[1]==="session"&&p[2]){state.ui.section="browser";state.ui.browserSessionId=p[2]}else state.ui.section=p[1]||"browser";}
 if(p[0]==="imti"){state.ui.mode="imti";state.ui.section=p[1]||"quick";if(p[1]==="chat"&&p[2]){state.ui.chatId=p[2];state.ui.openChatIds=[...(state.ui.openChatIds||[]).filter(x=>x!==p[2]),p[2]]}}
 if(p[0]==="mark"){state.ui.mode="mark";if(p[1]==="projects"&&p[2]){state.ui.projectId=p[2];state.ui.section=p[3]==="chat"?"chat":"project";if(p[4])state.ui.chatId=p[4]}else state.ui.section=p[1]||"quick";}
}
window.addEventListener("hashchange",()=>{loadHash();render()});
loadHash();
render();
})();</script>
</body>
</html>
