<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111113">
<title>Mark-Imti</title>
<style>
:root{--bg:#0b0b0d;--panel:#141416;--panel2:#19191c;--panel3:#202023;--line:#2a2a2e;--line2:#36363b;--text:#e7e5e2;--muted:#85838a;--dim:#5f5d64;--accent:#9e9ba4;--blue:#4b83ff;--radius:9px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.app{height:100vh;display:flex;overflow:hidden;background:var(--bg)}
.sidebar{width:205px;min-width:205px;background:#151517;border-right:1px solid var(--line2);display:flex;flex-direction:column;overflow:hidden}
.brandbar{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;justify-content:space-between}
.brand{font-weight:700;font-size:15px;letter-spacing:.1px}.headicons{display:flex;gap:9px;color:var(--muted)}
.iconbtn{width:20px;height:20px;display:grid;place-items:center;color:var(--muted);font-family:Arial,sans-serif;font-size:13px}.iconbtn:hover{color:var(--text)}
.modes{padding:9px 7px 5px;display:flex;gap:2px}.mode{height:27px;padding:0 8px;border-radius:7px;color:#77757b;font-size:12px;display:flex;align-items:center;gap:5px}.mode.active{background:#353539;color:#e4e2e0;box-shadow:inset 0 0 0 1px #3f3f44}.mode .mi{font-family:Arial,sans-serif;font-size:12px}
.nav{padding:0 7px 8px;border-bottom:1px solid #26262a}.navitem{height:29px;border-radius:7px;padding:0 8px;display:flex;align-items:center;gap:7px;color:#747278;font-size:13px}.navitem.active{background:#353538;color:#e7e5e3}.navitem:hover{background:#252529;color:#cfcdd0}.navicon{width:14px;text-align:center;font-family:Arial,sans-serif;font-size:12px}
.newchat{margin:7px 7px 4px;height:29px;border-radius:7px;background:#303033;border:1px solid #3a3a3e;text-align:left;padding:0 9px;font-size:13px}.newchat:hover{background:#39393d}
.chatlist{overflow:auto;padding:2px 7px 14px;flex:1}.sectionlabel{font-size:10px;letter-spacing:.08em;color:#8b8990;padding:7px 8px 5px}.chatrow{padding:7px 7px;border-radius:7px;min-height:41px}.chatrow.active{background:#303034}.chatrow:hover{background:#242428}.chatname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-family:Arial,sans-serif;font-size:9px;color:#6e6c72;margin-top:2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px;gap:6px}.top-title{font-size:12px;color:#a09ea4}.tab{height:28px;padding:0 10px;border-radius:7px;background:#2c2c30;color:#e3e1df;font-size:11px;border:1px solid #37373c}.plus{color:#8b8990;font-size:18px;line-height:1}.topright{margin-left:auto;display:flex;gap:8px;align-items:center}.searchmini{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;color:#4c80ff;font-family:Arial}.workspace{flex:1;min-height:0;position:relative;overflow:hidden}
.empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;padding-bottom:20px;text-align:center}.emptyicon{font-family:Arial;font-size:35px;color:#44444b;margin-bottom:9px}.empty h1{font-size:21px;margin:0 0 8px;font-weight:700}.empty p{font-size:12px;line-height:1.55;color:#6f6d74;max-width:410px;margin:0}
.composerzone{padding:8px 10px 9px}.suggestions{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:0 auto 9px;max-width:620px}.chip{border:1px solid #25252a;background:#101013;border-radius:16px;padding:6px 10px;color:#a8a6ac;font-size:11px}.chip:hover{background:#1d1d20;color:#ddd}
.composer{height:45px;border:1px solid #2b2b30;border-radius:24px;background:#111113;display:flex;align-items:center;padding:0 6px 0 7px;max-width:720px;margin:auto}.circle{width:30px;height:30px;border:1px solid #29292e;border-radius:50%;display:grid;place-items:center;color:#a4a1a7;font-family:Arial;font-size:17px;flex:0 0 auto}.prompt{flex:1;border:0;outline:0;background:transparent;padding:0 9px;font-family:Arial,sans-serif;font-size:12px;color:#ddd}.prompt::placeholder{color:#66646b}.drop{color:#8a888e;font-family:Arial}.think{height:29px;border:1px solid #2b2b30;border-radius:15px;padding:0 10px;color:#8b8990;font-size:11px}.voice{width:30px;color:#8c8a91;font-family:Arial}.hint{text-align:center;font-size:9px;color:#646269;margin-top:6px}
.browsergrid{height:100%;display:grid;grid-template-columns:43% 57%}.browserleft{display:flex;flex-direction:column;min-width:0}.browserright{border-left:1px solid #3b3b40;display:flex;flex-direction:column;min-width:0}.browserchrome{height:34px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 7px;gap:5px;font-family:Arial;font-size:11px}.btab{height:27px;min-width:91px;background:#242428;border:1px solid #303036;border-bottom-color:#4d79c8;border-radius:7px 7px 0 0;padding:0 8px;display:flex;align-items:center;gap:6px}.bplus{font-size:16px;color:#888}.navtools{display:flex;gap:8px;color:#777}.address{height:25px;flex:1;border:1px solid #2b2b30;border-radius:13px;background:#171719;color:#6d6b72;padding:0 10px;outline:0;font-size:10px}.browserempty{flex:1;display:grid;place-items:center;text-align:center;color:#67656c}.browserempty .globe{font-family:Arial;font-size:34px;margin-bottom:8px}.browserempty strong{display:block;font-size:13px;color:#77757b;font-weight:400}.browserempty span{font-size:10px}
.settings{height:100%;display:flex;flex-direction:column}.settingsbar{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:12px}.settingsbar strong{font-size:13px}.seg{display:flex;background:#171719;border:1px solid #29292e;border-radius:8px;overflow:hidden}.seg button{height:28px;padding:0 12px;color:#76747b;font-size:10px}.seg button.active{background:#252529;color:#ddd}.settingssearch{margin-left:auto;width:205px;height:28px;border:1px solid #29292e;border-radius:8px;background:#111113;padding:0 10px;outline:0;font-family:Arial;font-size:11px}.settingsbody{display:flex;flex:1;min-height:0;max-width:760px;width:100%;margin:0 auto;padding:18px 18px 30px;gap:12px}.settingsnav{width:128px;border-right:1px solid #28282d;padding-right:8px;overflow:auto}.settingsnav button{width:100%;text-align:left;height:29px;border-radius:7px;color:#77757b;padding:0 9px;font-size:12px}.settingsnav button.active{background:#242427;color:#e0dedd}.settingsnav button:hover{background:#202023;color:#c9c7ca}.settingspanel{flex:1;min-width:0;overflow:auto}.settingtitle{font-size:22px;margin:0 0 16px;display:flex;align-items:center;gap:8px}.profilecard{background:#19191b;border:1px solid #252529;border-radius:11px;padding:14px;max-width:430px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;margin-bottom:5px}.field small{display:block;color:#68666d;font-size:9px;margin:-2px 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid #303035;background:#242426;border-radius:9px;padding:7px 9px;outline:0;font-family:Arial,sans-serif;font-size:11px;color:#ddd}.field textarea{min-height:62px;resize:vertical}.save{background:#e8e7e5;color:#1a1a1c;border-radius:8px;padding:6px 9px;font-family:Arial;font-size:11px}.divider{border-top:1px solid #29292d;margin:10px 0 12px}
.contentpage{padding:24px;overflow:auto;height:100%}.contentpage h2{font-size:20px;margin:0 0 7px}.contentpage p{color:#737178;font-size:12px;line-height:1.5;max-width:580px}.listcard{border:1px solid #27272c;background:#161618;border-radius:9px;padding:10px;margin-top:12px;max-width:650px}.listrow{padding:10px 4px;border-bottom:1px solid #25252a;display:flex;justify-content:space-between;color:#aaa8ae;font-size:12px}.listrow:last-child{border-bottom:0}
.messages{height:100%;overflow:auto;padding:24px 18px 130px;max-width:760px;margin:auto}.msg{margin-bottom:14px}.msg.user{text-align:right}.bubble{display:inline-block;max-width:75%;padding:9px 12px;border-radius:12px;background:#202024;font-family:Arial,sans-serif;font-size:12px;line-height:1.5;text-align:left}.msg.assistant .bubble{background:transparent;padding-left:0;color:#c8c6ca}
@media(max-width:700px){.sidebar{width:188px;min-width:188px}.settingsbody{padding:14px 10px}.settingssearch{width:130px}.browsergrid{grid-template-columns:1fr}.browserright{display:none}.empty h1{font-size:19px}.suggestions{padding:0 8px}.chip{font-size:10px}.composerzone{padding-left:6px;padding-right:6px}}
@media(max-width:480px){.sidebar{width:178px;min-width:178px}.brandbar{padding:0 10px}.mode{padding:0 6px;font-size:11px}.navitem{font-size:12px}.settingsnav{width:105px}.settingsbar .seg{display:none}.settingssearch{width:115px}.settingtitle{font-size:19px}.profilecard{padding:11px}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#35353a;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const state={
 mode:localStorage.getItem('mi_mode')||'imti',
 page:localStorage.getItem('mi_page')||'quick',
 activeChat:localStorage.getItem('mi_chat')||'New chat',
 chats:JSON.parse(localStorage.getItem('mi_chats')||'[]'),
 settingsTab:localStorage.getItem('mi_setting_tab')||'Profile',
 messages:JSON.parse(localStorage.getItem('mi_messages')||'[]'),
 settings:JSON.parse(localStorage.getItem('mi_settings')||'{}'),
 browserUrl:localStorage.getItem('mi_browser_url')||'',
 browserTabs:JSON.parse(localStorage.getItem('mi_browser_tabs')||'["New Tab"]'),
 theme:localStorage.getItem('mi_theme')||'dark'
};
const navImti=[['quick','✣','Quick Action'],['library','◫','Library'],['scheduled','◴','Scheduled'],['skills','✧','Skills'],['projects','▱','Projects']];
const settingTabs=['Profile','Appearance','Scheduled','Execution','Browser','Computer','Security','Core Laws','Advanced','Data','Skills','Connectors','Knowledge','Memory','Agents','AI Studio','About'];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function persist(){localStorage.setItem('mi_mode',state.mode);localStorage.setItem('mi_page',state.page);localStorage.setItem('mi_chat',state.activeChat);localStorage.setItem('mi_chats',JSON.stringify(state.chats));localStorage.setItem('mi_setting_tab',state.settingsTab);localStorage.setItem('mi_messages',JSON.stringify(state.messages));localStorage.setItem('mi_settings',JSON.stringify(state.settings));localStorage.setItem('mi_browser_url',state.browserUrl);localStorage.setItem('mi_browser_tabs',JSON.stringify(state.browserTabs));localStorage.setItem('mi_theme',state.theme)}
function icon(i){return '<span class="navicon">'+i+'</span>'}
function sidebar(){
 const modes=[['imti','▣','Imti'],['mark','</>','Mark'],['browser','◎','Browser']];
 const isWorkspaceMode=state.mode==='browser'||state.mode==='mark';
 const quickActive=state.page==='quick'||(state.mode==='mark'&&state.page==='settings');
 const nav=navImti.map(n=>'<button class="navitem '+(n[0]==='quick'&&quickActive?'active':(state.page===n[0]&&!isWorkspaceMode?'active':''))+'" data-page="'+n[0]+'">'+icon(n[1])+n[2]+'</button>').join('');
 let lower='';
 if(state.mode==='browser'){
   lower='<div style="padding:16px 15px;color:#77757b"><div style="font-size:13px;margin-bottom:5px">Browser</div><div style="font-size:10px;line-height:1.45;color:#5f5d64">Ask Mark to browse in Browser mode — live sessions appear here.</div></div>';
 } else if(state.mode==='mark'&&state.page==='settings'){
   lower='<div style="padding:16px 15px;color:#77757b"><div style="font-size:10px;line-height:1.45;color:#5f5d64">Open the chat to see chats, projects and sessions.</div></div>';
 } else {
   lower='<button class="newchat" data-action="newchat">＋ New chat</button><div class="chatlist"><div class="sectionlabel">⚑ PINNED</div>'+pinnedChats()+'<div class="sectionlabel">TODAY</div>'+chatRows()+'</div>';
 }
 return '<aside class="sidebar"><div class="brandbar"><div class="brand">Mark-Imti</div><div class="headicons"><button class="iconbtn" data-action="search">⌕</button><button class="iconbtn" data-action="collapse">◫</button></div></div>'+
 '<div class="modes">'+modes.map(m=>'<button class="mode '+(state.mode===m[0]?'active':'')+'" data-mode="'+m[0]+'"><span class="mi">'+m[1]+'</span>'+m[2]+'</button>').join('')+'</div>'+
 '<div class="nav">'+nav+'</div>'+lower+'</aside>'
}
function pinnedChats(){const rows=['New chat','New chat','New chat','New chat'];return rows.map((x,i)=>'<div class="chatrow '+(state.activeChat===x&&i===0?'active':'')+'" data-chat="'+x+'"><div class="chatname">'+x+'</div><div class="count">0 msgs</div></div>').join('')}
function chatRows(){const arr=state.chats.length?state.chats:['New chat','New chat','New chat','New chat','New chat','New chat','New chat','New chat','New chat','New chat','New chat','New chat'];return arr.map(x=>'<div class="chatrow '+(state.activeChat===x?'active':'')+'" data-chat="'+esc(x)+'"><div class="chatname">'+esc(x)+'</div><div class="count">0 msgs</div></div>').join('')}
function topbar(title){
 return '<div class="topbar">'+(title?'<span class="top-title">'+esc(title)+'</span>':'')+(state.mode!=='mark'||state.page==='chat'?'<button class="tab" data-action="newchat">'+esc(state.activeChat)+'</button><button class="plus" data-action="newchat">＋</button>':'')+
 '<div class="topright"><button class="searchmini" data-action="search">⌕</button><button class="iconbtn" data-action="settings">⚙</button><button class="iconbtn" data-action="collapse">◫</button></div></div>'
}
function emptyChat(){
 const suggestions=['Create a to-do app','Research a topic','Write a report','Analyze data','Design a landing page','Plan a project'];
 return '<div class="workspace">'+(state.messages.length?messageView(): '<div class="empty"><div class="emptyicon">✣</div><h1>What can I help you build?</h1><p>Describe what you want in plain words — Mark reads it, decides what’s needed, and does it while you watch. No technical knowledge required.</p></div>')+'</div>'+
 '<div class="composerzone"><div class="suggestions">'+suggestions.map(x=>'<button class="chip" data-suggest="'+x+'">'+esc(x)+'</button>').join('')+'</div>'+composer('Ask anything, / for commands, @ for context...','Wave icon = voice conversation. Talk naturally to Mark or Imti.')+'</div>'
}
function messageView(){return '<div class="messages">'+state.messages.map(m=>'<div class="msg '+m.role+'"><div class="bubble">'+esc(m.text)+'</div></div>').join('')+'</div>'}
function composer(ph,hint){return '<div class="composer"><button class="circle" data-action="plus">＋</button><input id="composerInput" class="prompt" placeholder="'+ph+'"><button class="drop">⌄</button><button class="think">✣ Think</button><button class="voice">◒</button></div><div class="hint">'+hint+'</div>'}
function browserView(){
 return '<div class="workspace"><div class="browsergrid">'+
 '<div class="browserleft"><div class="browserchrome"><span>⌁</span><span>‹</span><span>›</span><span>↻</span><input class="address" id="browserInput" placeholder="Search or enter URL" value="'+esc(state.browserUrl)+'"></div>'+
 '<div class="browserempty"><div><div class="globe">◎</div><strong>What should I browse?</strong><span>Tell me a website to open or a topic to research</span></div></div>'+
 '<div class="composerzone">'+composer('Ask Mark to browse the web...','Browse mode — Mark opens the browser, searches, reads pages, and brings back answers.')+'</div></div>'+
 '<div class="browserright"><div class="browserchrome"><div class="btab">◎ New Tab</div><span class="bplus">＋</span></div><div class="browserchrome"><span class="navtools">‹　›　↻</span><input class="address" placeholder="Search or enter URL"></div><div class="browserempty"><div><div class="globe">◎</div><strong>New Tab</strong><span>Search or enter a URL to start</span></div></div></div>'+
 '</div></div>'
}
function settingsView(){
 return '<div class="settings">'+
 '<div class="settingsbar"><strong>Settings</strong><div class="seg"><button class="active">Chat</button><button>Work</button><button>Browse</button></div><input class="settingssearch" id="settingsSearch" placeholder="⌕  Search..."><button class="iconbtn" data-action="theme">☾</button></div>'+
 '<div class="settingsbody"><nav class="settingsnav">'+settingTabs.map(x=>'<button class="'+(state.settingsTab===x?'active':'')+'" data-setting="'+x+'">'+esc(x)+'</button>').join('')+'</nav><section class="settingspanel">'+settingPanel()+'</section></div></div>'
}
function settingPanel(){
 if(state.settingsTab==='Profile')return '<h1 class="settingtitle">⚙ Settings</h1><div class="profilecard"><h3 style="margin:0 0 13px;font-size:14px">Your Profile</h3>'+field('Email','email','local@mark-imti.app')+field('Full Name','fullName','Local User')+'<div class="field"><label>Role</label><div style="font-family:Arial;font-size:11px;color:#999">user</div></div><button class="save" data-action="save">Save Changes</button><div class="divider"></div>'+field('Custom instructions','instructions','e.g. Always answer in plain words, then show the technical details...','textarea')+'<h3 style="font-size:13px;margin:15px 0 12px">About you</h3>'+field('Nickname','nickname','Your nickname')+field('Occupation','occupation','Select...','select')+field('More about you','about','e.g. I care about clean design, privacy, and shipping fast...','textarea')+'</div>';
 return '<h1 class="settingtitle">⚙ '+esc(state.settingsTab)+'</h1><div class="listcard"><p>This Mark-Imti setting is ready for local configuration. Changes are kept in your browser.</p>'+['Preferences','Permissions','Defaults'].map(x=>'<div class="listrow"><span>'+x+'</span><span>›</span></div>').join('')+'</div>'
}
function field(label,key,placeholder,type='input'){const v=state.settings[key]||'';if(type==='textarea')return '<div class="field"><label>'+label+'</label><small>Additional behavior, style, and tone preferences.</small><textarea data-field="'+key+'" placeholder="'+placeholder+'">'+esc(v)+'</textarea></div>';if(type==='select')return '<div class="field"><label>'+label+'</label><small>What should Mark-Imti call you?</small><select data-field="'+key+'"><option>'+esc(v||placeholder)+'</option><option>Developer</option><option>Property professional</option><option>Designer</option><option>Other</option></select></div>';return '<div class="field"><label>'+label+'</label><input data-field="'+key+'" placeholder="'+placeholder+'" value="'+esc(v)+'"></div>'}
function contentPage(){
 const map={library:['Library','Your files, resources, and saved work appear here.'],scheduled:['Scheduled','Manage scheduled work and recurring tasks.'],skills:['Skills','Reusable skills and instructions available to Mark and Imti.'],projects:['Projects','Organize your active projects and pinned work.'],quick:['Quick Action','Start from a common action or describe your own task.']};
 const [title,desc]=map[state.page]||map.quick;
 return '<div class="contentpage"><h2>'+title+'</h2><p>'+desc+'</p><div class="listcard">'+['Create a new task','Open recent work','Review saved resources'].map(x=>'<div class="listrow"><span>'+x+'</span><span>›</span></div>').join('')+'</div></div>'
}
function render(){
 document.getElementById('app').innerHTML=sidebar()+'<main class="main">'+
 (state.mode==='browser'?topbar('')+browserView():
 state.mode==='mark'&&state.page==='settings'?settingsView():
 topbar(state.mode==='mark'?'Mark':'')+(state.page==='quick'||state.page==='chat'?emptyChat():contentPage()))+'</main>';
 bind();
}
function newChat(){
 const name='New chat';
 state.activeChat=name;
 state.page='chat';
 state.messages=[];
 state.chats.unshift(name);
 state.chats=state.chats.slice(0,30);
 persist();render();
}
function send(text){
 if(!text.trim())return;
 state.page='chat';state.messages.push({role:'user',text:text.trim()});
 state.messages.push({role:'assistant',text:'I’m ready. Tell me what you want to build, research, organize, or change.'});
 persist();render();
}
function bind(){
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.page=state.mode==='mark'?'settings':state.mode==='browser'?'chat':'quick';persist();render()});
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;persist();render()});
 document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{state.activeChat=b.dataset.chat;state.page='chat';persist();render()});
 document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{state.settingsTab=b.dataset.setting;persist();render()});
 document.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>send(b.dataset.suggest));
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.action;
  if(a==='newchat')newChat();
  if(a==='settings'){state.mode='mark';state.page='settings';persist();render()}
  if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';document.body.style.filter=state.theme==='light'?'invert(.88) hue-rotate(180deg)':'none';persist()}
  if(a==='save'){document.querySelectorAll('[data-field]').forEach(e=>state.settings[e.dataset.field]=e.value);persist();b.textContent='Saved';setTimeout(()=>{if(document.body.contains(b)){b.textContent='Save Changes'}},900)}
 });
 const input=document.getElementById('composerInput');if(input){input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input.value)}})}
 const bi=document.getElementById('browserInput');if(bi){bi.addEventListener('keydown',e=>{if(e.key==='Enter'){state.browserUrl=bi.value;persist();render()}})}
 document.querySelectorAll('[data-field]').forEach(e=>e.addEventListener('input',()=>{state.settings[e.dataset.field]=e.value;localStorage.setItem('mi_settings',JSON.stringify(state.settings))}));
}
render();
</script>
</body>
</html>
